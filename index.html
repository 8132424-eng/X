:root{--primary:#2c3e50;--accent:#3498db;--bg:#f8f9fa;--text:#333;--card:#fff;--border:#eef2f5}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--border);padding:22px 0}
.header-inner{max-width:900px;margin:0 auto;padding:0 20px}

/* ---- X-CCCP logo styles (copied from the X-CCCP single-file project) ---- */
.logo h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--primary)}
.logo h1 span{color:var(--accent)}
.logo .sub{font-size:0.75rem;letter-spacing:0.3em;color:var(--accent);text-transform:uppercase;margin-top:2px}
/* ------------------------------------------------------------------------- */

main{max-width:900px;margin:28px auto;padding:0 20px}
.section{background:var(--card);padding:32px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.category{margin-bottom:24px;background:#fafbfc;border:1px solid #edf1f4;border-radius:6px;padding:18px}
.category h3{margin:0 0 12px;font-size:1.15rem;color:var(--primary)}
.sub{margin:12px 0 0 16px;padding-left:14px;border-left:2px dashed #d0d7de}
.sub h4{margin:0 0 8px;font-size:1rem;color:#57606a}
.file-list{list-style:none;padding:0;margin:0}
.file-list li{margin:6px 0}
.file-list a{color:#24292f;text-decoration:none;font-weight:500}
.file-list a:hover{color:var(--accent);text-decoration:underline}
.file-list a::before{content:"📄 "}

.sub h4 {
   cursor: pointer;
   user-select: none;
}
.sub h4:hover {
   color: var(--accent);
}
.sub.collapsed > ul {
   display: none;
}
.sub h4::before {
   content: "▼ ";
   font-size: 0.8em;
}
.sub.collapsed > h4::before {
   content: "▶ ";
}
</style>

function renderCatalog() {
   const box = document.getElementById('catalog');
   let html = '';

   archive.forEach(function(cat) {
     html += '<div class="category">';
     html += '<h3>' + cat.name + '</h3>';

     if (cat.files) {
       html += '<ul class="file-list">';
       cat.files.forEach(function(f) {
         html += '<li><a href="' + f.url + '" target="_blank">' + f.title + '</a></li>';
       });
       html += '</ul>';
     }

     if (cat.subs) {
       cat.subs.forEach(function(sub) {
         html += '<div class="sub collapsed">';
         html += '<h4 onclick="toggle(this)">' + sub.name + '</h4>';
         html += '<ul class="file-list">';
         sub.files.forEach(function(f) {
           html += '<li><a href="' + f.url + '" target="_blank">' + f.title + '</a></li>';
         });
         html += '</ul></div>';
       });
     }

     html += '</div>';
   });

   box.innerHTML = html || '<p>Arkisto on tyhjä.</p>';
}

function toggle(el) {
   el.parentElement.classList.toggle('collapsed');
}

renderCatalog();
