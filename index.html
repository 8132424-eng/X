<style>
/* ==========================================================================
   ROOT VARIABLES — palette taken from the X-CCCP single-file project
   ========================================================================== */
:root {
  --bg: #f7f5f3;
  --surface: #ffffff;
  --surface2: #f0edea;
  --border: #dddddd;
  --text: #1e1e1e;
  --muted: #666666;
  --red: #c1121f;
  --red-dim: #8a0e18;
  --accent: #8a0e18;
  --radius: 10px;
}

/* ==========================================================================
   GLOBAL RESET
   ========================================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-top: 4px;           /* Space for the fixed red stripe */
}

/* ==========================================================================
   DECORATIVE RED STRIPE — exact copy from X-CCCP
   ========================================================================== */
.red-stripe {
  height: 4px;
  background: linear-gradient(90deg, var(--red), var(--red-dim), var(--red));
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
}

/* ==========================================================================
   HEADER — layout and padding from X-CCCP
   ========================================================================== */
header {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.25rem 0.5rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.logo h1 {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.logo h1 span { color: var(--red); }

.logo .sub {
  font-size: 0.75rem;
  letter-spacing: 0.3em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 2px;
}

/* ==========================================================================
   MAIN CONTENT AREA — padding from X-CCCP
   ========================================================================== */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 4rem;
}

/* Archive section: no white wrapper anymore — category headers sit
   directly on the page background. Only the interactive entries
   (sub-section headers and file links) keep the lighter surface. */
.section {
  background: transparent;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
}

/* ==========================================================================
   ARCHIVE MENU — styled after the "Tietolähde" page of X-CCCP.
   ========================================================================== */

/* Category block (e.g. "Gaz autot. Gaz cars.") */
.category {
  margin-bottom: 24px;
}
.category:last-child { margin-bottom: 0; }

/* Category title — plain header on the main background */
.category > h3 {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text);
  margin: 0 0 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

/* Vertical stack that holds sub-cards and file cards */
.link-stack {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin: 0 0 0.5rem;
}

/* Sub-section wrapper: no visible border, just the card inside */
.sub {
  margin: 0;
  padding: 0;
  border: none;
}

/* Sub-section header — clickable white card */
.sub h4 {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.9rem 1.25rem;
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  user-select: none;
  margin: 0;
  transition: border-color .2s, background .2s;
}
.sub h4:hover {
  border-color: var(--red);
  background: var(--surface2);
}

/* Expand/collapse marker */
.sub h4::before {
  content: "▼ ";
  font-size: 0.75em;
  color: var(--muted);
  margin-right: 0.4rem;
}
.sub.collapsed > h4::before {
  content: "▶ ";
}

/* File list inside a sub-section: same card style, smaller padding */
.sub ul.file-list {
  list-style: none;
  padding: 0;
  margin: 0.5rem 0 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.sub.collapsed > ul.file-list {
  display: none;
}

/* Individual file links — white card-like blocks */
.file-list a {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.7rem 1.25rem;
  color: var(--text);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  transition: border-color .2s, background .2s;
}
.file-list a:hover {
  border-color: var(--red);
  background: var(--surface2);
  text-decoration: none;
}
.file-list a::before {
  content: "📄 ";
}
</style>

function renderCatalog() {
   const box = document.getElementById('catalog');
   let html = '';

   archive.forEach(function(cat) {
     html += '<div class="category">';
     html += '<h3>' + cat.name + '</h3>';
     html += '<div class="link-stack">';

     if (cat.files) {
       cat.files.forEach(function(f) {
         html += '<a href="' + f.url + '" target="_blank">' + f.title + '</a>';
       });
     }

     if (cat.subs) {
       cat.subs.forEach(function(sub) {
         html += '<div class="sub collapsed">';
         html += '<h4 onclick="toggle(this)">' + sub.name + '</h4>';
         html += '<ul class="file-list">';
         sub.files.forEach(function(f) {
           html += '<li><a href="' + f.url + '" target="_blank">' + f.title + '</a></li>';
         });
         html += '</ul></div>';
       });
     }

     html += '</div>';   /* close .link-stack */
     html += '</div>';   /* close .category */
   });

   box.innerHTML = html || '<p>Arkisto on tyhjä.</p>';
}

function toggle(el) {
   el.parentElement.classList.toggle('collapsed');
}

renderCatalog();
